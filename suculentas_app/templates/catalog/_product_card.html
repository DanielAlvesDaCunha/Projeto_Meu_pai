<div class="col-6 col-md-4 col-lg-3">
  <article
    class="product h-100"
    data-product
    data-product-id="{{ product.id }}"
    data-product-name="{{ product.name }}"
    data-product-price="{{ product.price }}"
    data-product-sku="{{ product.sku }}"
    data-product-image="{% if product.image %}{{ product.image.url }}{% endif %}"
  >
    <div class="product-media">
      {% if product.discount_percent %}
        <span class="badge-off">{{ product.discount_percent }}% OFF</span>
      {% endif %}
      {% if product.image %}
        <img src="{{ product.image.url }}" alt="{{ product.name }}" loading="lazy" />
      {% else %}
        <div class="no-photo">Sem foto</div>
      {% endif %}
    </div>
    <div class="product-body">
      <h3>{{ product.name }}</h3>
      <p class="price">R$ {{ product.price|floatformat:2 }}</p>
      <p class="installments">{{ product.installment_text }}</p>
      <div class="product-actions">
        <button type="button" class="btn btn-buy" data-add-to-cart>Comprar</button>
      </div>
    </div>
  </article>
</div>
